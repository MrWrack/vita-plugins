name: Build VitaAutoPlugin

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: vdpm install libvita2d

      - name: Build VitaAutoPlugin VPK
        shell: bash
        run: |
          set -o pipefail
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 2>&1 | tee build/build.log
          test -s build/VitaAutoPlugin.vpk
          echo "VPK created:"
          ls -lh build/VitaAutoPlugin.vpk

      - name: Build background plugin global HUD
        shell: bash
        run: |
          set -o pipefail
          rm -rf background_plugin/build
          cmake -S background_plugin -B background_plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build background_plugin/build --parallel 2 2>&1 | tee background_plugin/build/plugin-build.log
          test -s background_plugin/build/VitaAutoPluginBackground.suprx
          echo "Background plugin created:"
          ls -lh background_plugin/build/VitaAutoPluginBackground.suprx

      - name: Prepare download package
        shell: bash
        run: |
          mkdir -p dist
          cp build/VitaAutoPlugin.vpk dist/VitaAutoPlugin-v0.39.vpk
          cp build/build.log dist/build.log
          if [ -f background_plugin/build/VitaAutoPluginBackground.suprx ]; then
            cp background_plugin/build/VitaAutoPluginBackground.suprx dist/
          fi
          if [ -f background_plugin/build/plugin-build.log ]; then
            cp background_plugin/build/plugin-build.log dist/
          fi
          ls -lh dist

      - name: Upload VitaAutoPlugin v0.39
        uses: actions/upload-artifact@v4
        with:
          name: VitaAutoPlugin-MrWrack-v0.39
          path: dist/
          if-no-files-found: error
