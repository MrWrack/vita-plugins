name: Build VitaAutoPlugin

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: vdpm install libvita2d

      - name: Build VitaAutoPlugin VPK
        shell: bash
        run: |
          set -o pipefail
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 2>&1 | tee build/build.log
          test -s build/VitaAutoPlugin.vpk
          echo "VPK created:"
          ls -lh build/VitaAutoPlugin.vpk

      - name: Build kernel HUD plugin
        shell: bash
        run: |
          set -o pipefail
          rm -rf kernel_hud/build
          cmake -S kernel_hud -B kernel_hud/build -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel_hud/build --parallel 2 2>&1 | tee kernel_hud/build/hud-build.log
          test -s kernel_hud/build/VitaAutoPluginHUD.skprx
          echo "Kernel HUD plugin created:"
          ls -lh kernel_hud/build/VitaAutoPluginHUD.skprx

      - name: Prepare download package
        shell: bash
        run: |
          mkdir -p dist
          cp build/VitaAutoPlugin.vpk dist/VitaAutoPlugin-v0.40.vpk
          cp build/build.log dist/build.log
          if [ -f kernel_hud/build/VitaAutoPluginHUD.skprx ]; then
            cp kernel_hud/build/VitaAutoPluginHUD.skprx dist/
          fi
          if [ -f kernel_hud/build/hud-build.log ]; then
            cp kernel_hud/build/hud-build.log dist/
          fi
          ls -lh dist

      - name: Upload VitaAutoPlugin v0.40
        uses: actions/upload-artifact@v4
        with:
          name: VitaAutoPlugin-MrWrack-v0.40
          path: dist/
          if-no-files-found: error
