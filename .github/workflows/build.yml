on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install libvita2d
        run: vdpm install libvita2d

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          cmake --build . -- -j2 2>&1 | tee build.log

      - name: Build background plugin alpha
        run: |
          mkdir -p background_plugin/build
          cd background_plugin/build
          cmake ..
          cmake --build . -- -j2 2>&1 | tee plugin-build.log

      - name: Upload VPK, background plugin and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitaAutoPlugin-v0.24
          path: |
            build/VitaAutoPlugin.vpk
            build/build.log
            background_plugin/build/VitaAutoPluginBackground.suprx
            background_plugin/build/plugin-build.log
